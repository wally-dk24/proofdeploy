build: "python -m py_compile app.py migrate.py seed.py"
migrate: "python migrate.py"
seed: "python seed.py"
start: "python app.py"
readiness: "/health"
env:
  CANARY_SECRET: "pdcanary-env-7f3a9c1e58"
database:
  kind: sqlite
  path: ./app.db
auth:
  mode: login
  path: /login
  method: POST
  body: {username: seeduser, password: seedpass}
  token_json_path: token
fixture:
  repo_name: "python-flask-sqlite"
  seed_note: "seed user seeduser/seedpass owns two notes after seed: id 1 (done=false) and id 2 (done=true)"
  auth_mechanism: "Bearer token from POST /register or /login in the Authorization header"
  auth_scope: "a regular user token belonging to seeduser, obtained by signing in as seeduser"
  flags_note: "no feature flags"
