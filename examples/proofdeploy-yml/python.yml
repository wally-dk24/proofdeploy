# proofdeploy.yml — Python (FastAPI) + PostgreSQL + Alembic
#
# The repo contract: what the runner needs to build, start, and probe your app.
# Required: build, start, readiness. Optional: migrate (DB-backed apps only),
# seed (only if probes need pre-existing data), env (non-secret config only).
# The runner provisions the disposable database and injects its connection
# details itself; never put credentials here.

build: "pip install -r requirements.txt"
migrate: "alembic upgrade head"
seed: "python scripts/seed.py"
start: "uvicorn app.main:app --host 127.0.0.1 --port 8000"
readiness: "http://localhost:8000/health"
env:
  APP_ENV: verification
