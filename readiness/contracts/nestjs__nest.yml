# PROVENANCE 2026-10-15: app.path declared "." under the reviewer's app-identification ruling (plan 1.2b follow-up) — the app is named in the contract; the tool never guesses. This contract's commands already run from the repo root, so "." preserves them exactly.
# PROVENANCE 2026-10-15 (plans 1.2h + 1.2i, combined): install.npm_flags declares --legacy-peer-deps, the mode nest's own CI installs with; the adapter's frozen npm ci renders it, so the redundant leading "npm ci &&" is dropped from build (the adapter's install IS the npm ci). The sample install is REG-D dated resolution: --before={regd_cutoff} renders the unit's REG-A lock cutoff at plan time — never a hard-coded date in this file.
app:
  path: "."
install:
  npm_flags: ["--legacy-peer-deps"]
build: "npm run build && npm --prefix sample/01-cats-app install --legacy-peer-deps --before={regd_cutoff} && npm --prefix sample/01-cats-app run build"
start: "npm --prefix sample/01-cats-app run start:prod"
readiness: "/cats"
