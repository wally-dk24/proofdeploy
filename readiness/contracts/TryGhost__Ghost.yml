# PROVENANCE 2026-10-15: app.path declared "." under the reviewer's app-identification ruling (plan 1.2b follow-up) — the app is named in the contract; the tool never guesses. This contract's commands already run from the repo root, so "." preserves them exactly.
# PROVENANCE 2026-10-15 (plan 1.2f): build drops "pnpm run bootstrap &&" — bootstrap is a non-frozen pnpm install reinstall plus git submodule update --init --recursive, which a history-less snapshot cannot fetch; the adapter's frozen install is the only install.
# PROVENANCE 2026-10-16 (D71): migrate removed — Ghost initializes and migrates its own SQLite DB on boot (ghost/core/core/boot.js awaits DatabaseStateManager.makeReady(), ghost/core/core/server/data/db/database-state-manager.js, which runs knexMigrator init/migrate; verified at all 3 registered SHAs). The removed "pnpm run migrate:db" shelled out to `docker exec`, which does not exist in the sandbox. start is upstream's ghost/core dev entry without the watcher: package.json "dev" is "nodemon index.js" and ghost/core/nodemon.json's exec is "node --conditions=source --import=tsx" (exec identical at all 3 SHAs), with server__host/server__port set by env as the previous start did. Build and readiness unchanged.
app:
  path: "."
build: "pnpm run build"
start: "cd ghost/core && server__host=0.0.0.0 server__port=$PORT node --conditions=source --import=tsx index.js"
readiness: "/"
