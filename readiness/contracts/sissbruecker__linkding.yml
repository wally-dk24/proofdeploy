# PROVENANCE 2026-10-21 (WO-R5-K, D267): generic lean contract for
# sissbruecker/linkding, derived only from the app's source at HEAD
# 27b7303baf41bb28babc610ac8eaa486e1ddfab5 (file:line below are at that SHA;
# no commit message, log or diff was read).
# Runtime: Django app, manage.py at the repo root (app.path "."), uv project with
# a committed uv.lock, requires-python >=3.13 (pyproject.toml:6); SQLite is the
# default engine (bookmarks/settings/base.py:263) at data/db.sqlite3
# (base.py:284); the task queue file is data/tasks.sqlite3 (base.py:180).
# build: the data folders upstream's bootstrap.sh creates before migrate
# (bootstrap.sh:8-14); no frontend build is needed for the JSON API or /health.
# migrate: upstream's own `python manage.py migrate` (bootstrap.sh:19).
# start: one process, no watcher, no task consumer (upstream runs uwsgi plus a
# supervisord task consumer, bootstrap.sh:30-39); hence the flags_note's "no
# background task worker".
# env: manage.py honours a preset DJANGO_SETTINGS_MODULE (manage.py:8); the
# default resolves to the dev module (DEBUG on), the prod module sets DEBUG =
# False (bookmarks/settings/prod.py:15), ALLOWED_HOSTS ["*"] unless HOST_NAME is
# set (prod.py:26-30) and a per-process random secret key without
# data/secretkey.txt (prod.py:17-22). Ruling: bookmarks.settings.prod.
# readiness "/health": unauthenticated JSON, 200 once the database connection
# works (bookmarks/views/health.py:7-17; bookmarks/urls.py:111).
# auth: linkding has no endpoint that exchanges credentials for a token (the
# token classes are bookmarks/api/auth.py:15-38, REST_FRAMEWORK in
# bookmarks/settings/base.py:145-150, permission IsAuthenticated). An API token is
# an ApiToken row with a 40-character unique key that save() keeps when preset
# (bookmarks/models.py:518-535). So the lean mode is static_token: the value
# of LD_API_TOKEN is generated by ProofDeploy per side and per run (D8), the
# seed writes it into the app, and every authenticated request presents it.
# proof_path /api/user/profile/ is UserViewSet.profile (bookmarks/api/routes.py:
# 258-261, user_router at bookmarks/urls.py:100): authenticated, own-profile JSON.
# seed: the app's own create_initial_superuser (reads LD_SUPERUSER_NAME and
# LD_SUPERUSER_PASSWORD, bookmarks/management/commands/create_initial_superuser.py:
# 15-16; an unset password gives an unusable password, :33-36) plus one
# ApiToken. The text is readiness/seeds/linkding-seed.py, embedded because a
# sandbox checkout holds no file from readiness/seeds/.
# fixture: per-user defaults are off (bookmarks/models.py:439-442, web archive
# disabled :421-426); the profile row is created by the app on user creation
# (models.py:474-477) and the global settings row on the first request
# (models.py:560-565).
app:
  path: "."
build: "mkdir -p data/favicons data/previews data/assets"
migrate: "python manage.py migrate --noinput"
seed: |
  python manage.py shell <<'PD_LINKDING_SEED'
  # ProofDeploy seed for the linkding contract (D267, round 5, WO-R5-K).
  #
  # Run as `python manage.py shell < <this file>` inside the checkout, with the
  # side's generated bootstrap values in the environment (LD_SUPERUSER_NAME and
  # LD_API_TOKEN). The contract's `seed:` carries this text verbatim (the
  # sandbox checkout holds no file from readiness/seeds/), and a test keeps the
  # two identical.
  #
  # It creates exactly one superuser, through the app's own
  # `create_initial_superuser` command (bookmarks/management/commands/
  # create_initial_superuser.py, linkding 27b7303b), and exactly one API token
  # for that user whose key is the generated LD_API_TOKEN value. Nothing else.
  # No LD_SUPERUSER_PASSWORD is declared, so the command gives the user an
  # unusable password: the token is the only credential.
  import os

  from bookmarks.models import ApiToken
  from django.contrib.auth import get_user_model
  from django.core.management import call_command

  name = os.environ["LD_SUPERUSER_NAME"]
  key = os.environ["LD_API_TOKEN"]
  call_command("create_initial_superuser")
  user = get_user_model().objects.get(username=name)
  ApiToken.objects.create(user=user, name="ProofDeploy", key=key)
  PD_LINKDING_SEED
start: "python manage.py runserver 0.0.0.0:$PORT --noreload"
readiness: "/health"
database:
  kind: sqlite
  path: data/db.sqlite3
env:
  DJANGO_SETTINGS_MODULE: bookmarks.settings.prod
auth:
  mode: static_token
  token_env: LD_API_TOKEN
  proof_path: /api/user/profile/
  bootstrap_env: [LD_SUPERUSER_NAME, LD_API_TOKEN]
fixture:
  repo_name: "sissbruecker/linkding"
  seed_note: "The first migrate run on an empty database created the schema and no application records beyond what Django itself generates for every installed model (permission and content-type records). ProofDeploy's setup then ran the app's own create_initial_superuser command, which created one superuser whose username is generated fresh for each run and which has no usable password, and created one API token for that user, named 'ProofDeploy', whose value is generated fresh for each run. The app's per-user settings record for that user was created by the app on user creation, and its global settings record is created by the app on the first request, both with default values. No bookmarks, tags or bundles were created."
  auth_mechanism: "the token is presented in the Authorization header in the form 'Token <token>'"
  auth_scope: "the API token belonging to the generated superuser; ProofDeploy created it during setup and uses the same value for every request, there is no sign-in step"
  flags_note: "application settings are at this version's defaults except the run's deployment choices (SQLite database, production settings module, no background task worker); per-user options are at their defaults; no feature flags were changed"
