# Sandbox focus runs (Addendum 35): iterate on ONE sandbox test
# selection in minutes instead of the full 43-minute sandbox suite.
#
# Dispatch it with a pytest -k expression:
#   gh workflow run sandbox-focus.yml --ref <branch> \
#     -f expression="node-express-sqlite"
# The matching tests run with -x and PD_REQUIRE_SANDBOX=1 (a skip
# fails), and the tests' pd-logs/ are uploaded as an artifact — the
# full provision logs, so a failing install's real error line can
# be read directly instead of guessed from trimmed output.

name: sandbox-focus

on:
  workflow_dispatch:
    inputs:
      expression:
        description: "pytest -k expression (e.g. node-express-sqlite)"
        required: true
        type: string
      network_mode:
        description: "WO-7.3: force one sandbox network mode for the run (auto, isolated, none+socket). A forced mode the runner cannot create fails the run with the refusal and its reason — not a skip."
        required: false
        default: "auto"
        type: string

jobs:
  focus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run focused sandbox tests
        env:
          PD_REQUIRE_SANDBOX: "1"
          PD_FORCE_NETWORK_MODE: ${{ inputs.network_mode }}
        # --no-cov: a -k subset can never reach the repo's 80%
        # coverage gate; the focus job judges the selected tests.
        run: |
          python -m pytest tests/ -x -q --no-cov -k "${{ inputs.expression }}"

      - name: Upload provision logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pd-logs
          path: pd-logs/
          retention-days: 7
