# Provisioning readiness pass (Addendum 64/65, WAL-112).
#
# Manual dispatch only, one repo per dispatch. Provisions every
# registered side of that repo from readiness/manifest.json
# through the real sandboxed runner path (readiness/provision.py
# drives Orchestrator._provision_side_sandbox — the measured
# path's own method) and uploads the readiness rows + pd-logs/ as
# an artifact. No model call, no probes, no scoring, and NO
# measured records: the rows JSON is labelled "readiness".
#
# Addendum 65 (6): permissions are contents: read only; there is
# no environment and no secret anywhere in this workflow; every
# action is pinned by SHA (the same pins as the ci workflow).
#
# Attempt semantics: attempt 1 provisions each side once. An
# attempt-2 dispatch performs that same first pass and then
# re-provisions only the non-READY sides (the harness's
# --rerun-non-ready mode, fed the attempt-1 rows written earlier
# in the same job), so one artifact carries both attempts' rows,
# as the pass requires ("run each side once, rerun every
# non-READY side once, report both"). Nothing here runs on push
# or pull_request, and no run is dispatched before this PR's
# review and merge.
#
# Auth-proof mode (D87, generalized D137): mode=auth-proof runs
# readiness/auth_proof instead of the provision pass — the same
# provisioning path, then three executor probes per side proving
# the contract's declared auth (two authenticated 200s, each with
# its own fresh acquisition counted by kind from the provider's
# detail lines, and an unauthenticated request refused with the
# repo's registered status). The driver is contract-driven: the
# provider and token presentation come from the repo's committed
# contract; only the endpoint and expected refusal status are
# registered per repo. The optional `only` input restricts it to
# comma-separated <unit>:<role> sides (the one-side rehearsal).
# Auth-proof rows are labelled "auth-proof"; like the provision
# rows they are evidence, never measured records.
#
# Pair mode (D194): the optional fix_parent_sha / fix_sha inputs
# serve WO-6 bug selection's check (d). When BOTH are set (mode
# provision only), the pass provisions exactly that pair for the
# dispatched repo as one synthetic unit (roles fix^ and fix) with
# the repo's registered contract-store entry, instead of the
# manifest's units; when BOTH are empty, behaviour is unchanged
# (manifest-driven). The pair is all-or-nothing (D196): exactly
# one set fails closed rather than silently falling back to the
# manifest, and either set with mode auth-proof fails closed —
# the pair means nothing outside a provision pass. Each value
# must be exactly 40 lowercase hex characters — the workflow
# validates them before provisioning and fails closed on
# anything else. The values travel via step env only, never
# interpolated into run: text.
name: readiness

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository from readiness/manifest.json"
        required: true
        type: choice
        options:
          - TryGhost/Ghost
          - directus/directus
          - vendure-ecommerce/vendure
          - nestjs/nest
          - fastify/fastify
          - django/django
          - LMCache/LMCache
          - bottlepy/bottle
          - codeigniter4/CodeIgniter4
          - honojs/hono
          - paperless-ngx/paperless-ngx
      attempt:
        description: "Highest attempt to perform (2 = first pass + rerun of non-READY sides)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
      mode:
        description: "provision = readiness pass; auth-proof = D87 auth proof per side"
        required: true
        default: "provision"
        type: choice
        options:
          - "provision"
          - "auth-proof"
      only:
        description: "auth-proof only: comma-separated <unit>:<role> sides (empty = all sides)"
        required: false
        default: ""
        type: string
      fix_parent_sha:
        description: "provision only (D194): with fix_sha, provision exactly this fix^/fix pair as one synthetic unit (empty = manifest-driven)"
        required: false
        default: ""
        type: string
      fix_sha:
        description: "provision only (D194): the pair's fix commit (see fix_parent_sha)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Compute artifact slug
        id: slug
        run: echo "slug=$(echo '${{ inputs.repo }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate pair SHAs (D194/D196, fail closed)
        env:
          PD_MODE: ${{ inputs.mode }}
          PD_FIX_PARENT_SHA: ${{ inputs.fix_parent_sha }}
          PD_FIX_SHA: ${{ inputs.fix_sha }}
        run: |
          if [ "$PD_MODE" = "auth-proof" ] && { [ -n "$PD_FIX_PARENT_SHA" ] || [ -n "$PD_FIX_SHA" ]; }; then
            echo "::error::pair SHAs are provision-mode only (D194): unset fix_parent_sha/fix_sha for an auth-proof run"
            exit 1
          fi
          if { [ -n "$PD_FIX_PARENT_SHA" ] && [ -z "$PD_FIX_SHA" ]; } || { [ -z "$PD_FIX_PARENT_SHA" ] && [ -n "$PD_FIX_SHA" ]; }; then
            echo "::error::fix_parent_sha and fix_sha must be set together (D196): exactly one was given"
            exit 1
          fi
          for value in "$PD_FIX_PARENT_SHA" "$PD_FIX_SHA"; do
            if [ -n "$value" ] && [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::pair SHAs must be exactly 40 lowercase hex characters"
              exit 1
            fi
          done
      - name: Measurement gate (fail closed on an incapable host)
        run: |
          python -c "from proofdeploy.sandbox import assert_measurement_gate; assert_measurement_gate(); print('measurement gate: capable')"
      - name: Provision attempt 1 (${{ inputs.repo }})
        if: inputs.mode == 'provision'
        env:
          PD_FIX_PARENT_SHA: ${{ inputs.fix_parent_sha }}
          PD_FIX_SHA: ${{ inputs.fix_sha }}
        run: |
          args=()
          if [ -n "$PD_FIX_PARENT_SHA" ] && [ -n "$PD_FIX_SHA" ]; then
            args+=(--fix-parent-sha "$PD_FIX_PARENT_SHA" --fix-sha "$PD_FIX_SHA")
          fi
          python -m readiness.provision \
            --repo "${{ inputs.repo }}" \
            --attempt 1 \
            --out "rows-attempt1.json" \
            --workdir readiness-work \
            "${args[@]}"
      - name: Re-provision non-READY sides (attempt 2)
        if: inputs.mode == 'provision' && inputs.attempt == '2'
        env:
          PD_FIX_PARENT_SHA: ${{ inputs.fix_parent_sha }}
          PD_FIX_SHA: ${{ inputs.fix_sha }}
        run: |
          args=()
          if [ -n "$PD_FIX_PARENT_SHA" ] && [ -n "$PD_FIX_SHA" ]; then
            args+=(--fix-parent-sha "$PD_FIX_PARENT_SHA" --fix-sha "$PD_FIX_SHA")
          fi
          python -m readiness.provision \
            --repo "${{ inputs.repo }}" \
            --attempt 2 \
            --rerun-non-ready rows-attempt1.json \
            --out "rows-attempt2.json" \
            --workdir readiness-work \
            "${args[@]}"
      - name: Auth proof (${{ inputs.repo }})
        if: inputs.mode == 'auth-proof'
        env:
          PROOF_REPO: ${{ inputs.repo }}
          PROOF_ONLY: ${{ inputs.only }}
        run: |
          args=()
          if [ -n "$PROOF_ONLY" ]; then
            IFS=',' read -ra wanted <<< "$PROOF_ONLY"
            for side in "${wanted[@]}"; do
              args+=(--only "$side")
            done
          fi
          python -m readiness.auth_proof \
            --repo "$PROOF_REPO" \
            --attempt 1 \
            --out "rows-authproof.json" \
            --workdir readiness-work \
            "${args[@]}"
      - name: Upload readiness rows and provision logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readiness-${{ steps.slug.outputs.slug }}-${{ inputs.attempt }}
          path: |
            rows-attempt*.json
            rows-authproof*.json
            pd-logs/
          retention-days: 14
