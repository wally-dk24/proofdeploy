# ProofDeploy measurement workflow (WO-5).
#
# Manually triggered. Runs one measured unit through `proofdeploy measure`
# in the sandbox. FAILS CLOSED: refuses to run if the capability probe
# fails the measurement gate. Never falls back to unsandboxed.
#
# Secrets: uses the `measurement` environment (not repository secrets).
# Master holds GROQ_API_KEY there with himself as required reviewer.
# The key never enters the container environment, never appears in a
# prompt, and is redacted by value in every record.
#
# Records: the evidence commit is pushed first, then the score commit,
# to the `records/run-<run-id>` branch. The runner's disk is wiped after
# the run; the branch is the durable store.
#
# Provenance: passed to `measure` itself via --provenance-* args, so the
# evidence record carries the Actions run URL/ID, runner image, and the
# capability probe output.
#
# Public env keys (D203): the optional public_env_keys input names
# contract env keys whose values are benign public config (e.g.
# Django backend class paths the app itself prints in its own
# files), so the bundle leak check does not refuse the run on them.
# A validation step checks every key BEFORE the measure step and
# fails the job on any refusal (see validate_public_env_keys in
# proofdeploy/cli.py): credential-shaped names and the contract's
# auth.bootstrap_env names can never be declared public.
#
# Dry run (D222): the dry_run input's "provision" choice runs the
# provision rehearsal instead of a measured run — both sides are
# provisioned through the measured path, the unit's fixed rehearsal
# probe set (readiness/rehearsal/<owner>__<repo>.json) runs through
# the real executor on both sides, an evidence record marked
# dry_run=provision is written, and the run stops before any model
# call (the rehearsal does not read the API key). The job stays in
# the measurement environment and in the serialization group
# either way.
#
# DO NOT TRIGGER before the reviewer has seen the exact contents.
# Any change to this workflow goes back to review.

name: measure

on:
  workflow_dispatch:
    inputs:
      arm:
        description: "Probe-authoring arm: skill or no-skill"
        required: true
        type: choice
        options:
          - skill
          - no-skill
      target_repo:
        description: "Target app repo URL (e.g. https://github.com/org/app.git)"
        required: true
        type: string
      unit_repo:
        description: "Unit repo slug for the contract-store lookup; golden/<app> materializes a golden unit instead of cloning target_repo"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - golden/node-express-sqlite
          - golden/python-flask-sqlite
      bug_id:
        description: "Bug ID (for bug runs; leave empty for clean runs)"
        required: false
        type: string
      base:
        description: "B^: parent of the bug-introducing commit"
        required: false
        type: string
      bug:
        description: "B: the bug-introducing commit"
        required: false
        type: string
      fix:
        description: "The fix commit"
        required: false
        type: string
      clean_id:
        description: "Clean ID (for clean runs; leave empty for bug runs)"
        required: false
        type: string
      clean:
        description: "C: the clean-diff commit"
        required: false
        type: string
      public_env_keys:
        description: "Contract env keys whose values are benign public config, not secrets (space-separated; validated fail-closed before the measure step)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run mode: none = the full measured run; provision = provision rehearsal only (both sides provisioned, the unit's fixed rehearsal probe set run on both sides, record written, no model call)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - provision

# Least privilege: only need to push records to this repo.
permissions:
  contents: write

# D101 item 3a (D159): serialize every model-calling workflow.
# verify and measure share this one group; with queue: max the runs
# are queued up to 100, sequential, and never cancelled mid-flight.
# (GitHub's default keeps only ONE pending run per group and cancels
# the older pending one when another arrives; cancel-in-progress:
# false alone does not prevent that.)
concurrency:
  group: proofdeploy-model-calls
  cancel-in-progress: false
  queue: max

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The environment gate: Master must approve before this runs.
    # GROQ_API_KEY lives in the `measurement` environment.
    environment: measurement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate public env keys (D203, fail closed)
        if: ${{ inputs.public_env_keys != '' }}
        env:
          PUBLIC_ENV_KEYS: ${{ inputs.public_env_keys }}
          UNIT_REPO: ${{ inputs.unit_repo }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          python - <<'PY'
          import os
          import sys

          from proofdeploy.cli import (
              contract_bootstrap_env_names,
              validate_public_env_keys,
          )

          keys = os.environ["PUBLIC_ENV_KEYS"].split()
          bootstrap = contract_bootstrap_env_names(
              os.environ.get("UNIT_REPO") or None,
              os.environ.get("TARGET_REPO") or None,
          )
          if bootstrap is None:
              print(
                  "public_env_keys: the dispatched unit's contract "
                  "could not be resolved; refusing to validate",
                  file=sys.stderr,
              )
              sys.exit(1)
          try:
              accepted = validate_public_env_keys(
                  keys, bootstrap_env_names=bootstrap
              )
          except ValueError as exc:
              print(f"public_env_keys: {exc}", file=sys.stderr)
              sys.exit(1)
          print("public env keys accepted:", " ".join(accepted))
          PY

      - name: Check out target repo
        # D154: golden units are materialized, not cloned.
        if: ${{ !startsWith(inputs.unit_repo, 'golden/') }}
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          # Quote the input via env to avoid shell injection.
          git clone "$TARGET_REPO" /tmp/target-repo

      - name: Materialize golden unit
        # D154: a golden unit exists only as committed revision trees
        # under conformance/golden/ in THIS repo. Materialize it with
        # the conformance kit at the ProofDeploy commit being run;
        # the kit's revision SHAs become the measure inputs (its
        # linear history carries fix-parent as an ancestor of fix).
        if: ${{ startsWith(inputs.unit_repo, 'golden/') }}
        id: golden
        env:
          UNIT_REPO: ${{ inputs.unit_repo }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from conformance.kit import materialize_golden

          app = os.environ["UNIT_REPO"].removeprefix("golden/")
          shas = materialize_golden(app, Path("/tmp/target-repo"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for name in ("base", "bug", "fix", "clean"):
                  print(f"{name}={shas[name]}", file=fh)
          PY

      - name: Capability probe (fail-closed gate)
        id: probe
        run: |
          python -c "
          from proofdeploy.sandbox import assert_measurement_gate
          # Fail-closed: raises if the host cannot meet the requirements.
          # No config arg needed; uses defaults. This step fails the
          # workflow if the gate fails. No fallback.
          probe = assert_measurement_gate()
          print('GATE PASSED')
          import json
          print(json.dumps(probe, indent=2))
          "

      - name: Run measured unit
        id: measure
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ARM: ${{ inputs.arm }}
          UNIT_REPO: ${{ inputs.unit_repo }}
          BUG_ID: ${{ inputs.bug_id }}
          BASE: ${{ steps.golden.outputs.base || inputs.base }}
          BUG: ${{ steps.golden.outputs.bug || inputs.bug }}
          FIX: ${{ steps.golden.outputs.fix || inputs.fix }}
          CLEAN_ID: ${{ inputs.clean_id }}
          CLEAN: ${{ steps.golden.outputs.clean || inputs.clean }}
          PUBLIC_ENV_KEYS: ${{ inputs.public_env_keys }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          # Note: $ImageOS/$ImageVersion are available in the runner env;
          # we pass them via env below for provenance.
        run: |
          # The key is available to `proofdeploy measure` on the host only.
          # It never enters containers, never appears in prompts, and is
          # redacted by value in records.
          # Use set +e: if measure fails, we still write the SHAs (which
          # may be empty) to GITHUB_OUTPUT, then exit with the code.
          set +e
          mkdir -p /tmp/workdir /tmp/output
          # Provenance goes to `measure` itself via --provenance-* args,
          # so the evidence record carries them (not via GITHUB_ENV after).
          PROV_ARGS="--provenance-run-url $RUN_URL --provenance-run-id $RUN_ID --provenance-runner-image $ImageOS-$ImageVersion"
          if [ "$ARM" = "skill" ]; then
            # The skill arm uses the registered skill file from the repo.
            SKILL_ARGS="--skill $GITHUB_WORKSPACE/docs/evaluation/skill/skill-author.md"
          else
            SKILL_ARGS="--no-skill"
          fi
          # D154: --unit-repo names the contract-store slug. Empty for
          # real-repo runs, which leaves their command line unchanged.
          if [ -n "$UNIT_REPO" ]; then
            UNIT_ARGS="--unit-repo $UNIT_REPO"
          else
            UNIT_ARGS=""
          fi
          # D203: --public-env-key for each dispatched key. The keys
          # were validated fail-closed by the step above (a bad key
          # already failed the job); empty input expands to nothing
          # and leaves the command line unchanged.
          PUBLIC_ENV_ARGS=""
          for key in $PUBLIC_ENV_KEYS; do
            PUBLIC_ENV_ARGS="$PUBLIC_ENV_ARGS --public-env-key $key"
          done
          # D221: the provision rehearsal flag. "none" (the default)
          # expands to nothing and leaves the command line a plain
          # measured run.
          if [ "$DRY_RUN" = "provision" ]; then
            DRY_RUN_ARGS="--dry-run-provision"
          else
            DRY_RUN_ARGS=""
          fi
          if [ -n "$BUG_ID" ]; then
            OUTPUT=$(python -m proofdeploy.cli measure \
              --repo /tmp/target-repo \
              --workdir /tmp/workdir \
              --output-dir /tmp/output \
              $SKILL_ARGS \
              $UNIT_ARGS \
              $PUBLIC_ENV_ARGS \
              $DRY_RUN_ARGS \
              --bug-id "$BUG_ID" \
              --base "$BASE" \
              --bug "$BUG" \
              --fix "$FIX" \
              $PROV_ARGS 2>&1)
          else
            OUTPUT=$(python -m proofdeploy.cli measure \
              --repo /tmp/target-repo \
              --workdir /tmp/workdir \
              --output-dir /tmp/output \
              $SKILL_ARGS \
              $UNIT_ARGS \
              $PUBLIC_ENV_ARGS \
              $DRY_RUN_ARGS \
              --clean-id "$CLEAN_ID" \
              --clean "$CLEAN" \
              $PROV_ARGS 2>&1)
          fi
          CODE=$?
          echo "$OUTPUT"
          # Take the evidence and score SHAs from measure's own output.
          # Always write them (even if empty) so the push step can decide.
          EVIDENCE_SHA=$(echo "$OUTPUT" | grep -oP 'evidence committed: \K[0-9a-f]{40}' | head -1)
          SCORE_SHA=$(echo "$OUTPUT" | grep -oP 'score committed: \K[0-9a-f]{40}' | head -1)
          echo "evidence_sha=$EVIDENCE_SHA" >> "$GITHUB_OUTPUT"
          echo "score_sha=$SCORE_SHA" >> "$GITHUB_OUTPUT"
          exit $CODE

      - name: Push records to durable branch
        # Always push, even if the run failed or was INCONCLUSIVE.
        # INCONCLUSIVE runs count in the published rates.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVIDENCE_SHA: ${{ steps.measure.outputs.evidence_sha }}
          SCORE_SHA: ${{ steps.measure.outputs.score_sha }}
        run: |
          # Push the evidence commit first, then the score commit, as two
          # separate pushes to the records branch. The runner's disk is
          # wiped after the run; the branch is the durable store.
          # Use an explicit token URL (checkout used persist-credentials: false).
          # Never push an empty source: `git push <url> ":refs/heads/…"`
          # DELETES the branch.
          RECORDS_BRANCH="records/run-$RUN_ID"
          cd /tmp/output
          git config user.name "proofdeploy-measure"
          git config user.email "proofdeploy-measure@users.noreply.github.com"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -n "$EVIDENCE_SHA" ]; then
            git push "$REPO_URL" "$EVIDENCE_SHA:refs/heads/$RECORDS_BRANCH"
            echo "Pushed evidence $EVIDENCE_SHA to $RECORDS_BRANCH"
          elif git rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "WARNING: no evidence SHA parsed; pushing HEAD"
            git push "$REPO_URL" "HEAD:refs/heads/$RECORDS_BRANCH"
          else
            echo "WARNING: no evidence SHA and no HEAD; nothing to push"
          fi
          if [ -n "$SCORE_SHA" ]; then
            git push "$REPO_URL" "$SCORE_SHA:refs/heads/$RECORDS_BRANCH"
            echo "Pushed score $SCORE_SHA to $RECORDS_BRANCH"
          else
            echo "WARNING: no score SHA parsed; skipping score push"
          fi
