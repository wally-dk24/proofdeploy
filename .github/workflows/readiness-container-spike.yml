# Container-path readiness spike (WAL-112 follow-on work order).
#
# Manual dispatch only, one repo per dispatch. For every
# registered side of that repo (readiness/manifest.json), the
# spike materializes the snapshot at the side's registered SHA,
# builds the app's OWN root Dockerfile (or single-service compose
# build) with podman, runs it with --net=none behind the sandbox's
# Unix-socket bridge, and probes the contract's readiness path —
# readiness/container_spike.py. Evidence only: no model call, no
# probes of the measured kind, no scoring, NO measured records,
# and the native provisioner is untouched.
#
# Permissions are contents: read only; there is no environment
# and no secret anywhere in this workflow; every action is
# pinned by SHA (the same pins as the readiness workflow).
#
# Attempt semantics mirror the readiness workflow: attempt 1
# spikes each side once; an attempt-2 dispatch performs that same
# first pass and then re-spikes only the non-READY sides (the
# module's --rerun-non-ready mode), so one artifact carries both
# attempts' rows. Nothing here runs on push or pull_request.
name: readiness-container-spike

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository from readiness/manifest.json"
        required: true
        type: choice
        options:
          - TryGhost/Ghost
          - directus/directus
          - vendure-ecommerce/vendure
          - nestjs/nest
          - fastify/fastify
          - django/django
          - LMCache/LMCache
          - bottlepy/bottle
          - codeigniter4/CodeIgniter4
          - honojs/hono
      attempt:
        description: "Highest attempt to perform (2 = first pass + rerun of non-READY sides)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Compute artifact slug
        id: slug
        run: echo "slug=$(echo '${{ inputs.repo }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Measurement gate (fail closed on an incapable host)
        run: |
          python -c "from proofdeploy.sandbox import assert_measurement_gate; assert_measurement_gate(); print('measurement gate: capable')"
      - name: Spike attempt 1 (${{ inputs.repo }})
        run: |
          python -m readiness.container_spike \
            --repo "${{ inputs.repo }}" \
            --attempt 1 \
            --out "rows-spike-attempt1.json" \
            --workdir spike-work
      - name: Re-spike non-READY sides (attempt 2)
        if: inputs.attempt == '2'
        run: |
          python -m readiness.container_spike \
            --repo "${{ inputs.repo }}" \
            --attempt 2 \
            --rerun-non-ready rows-spike-attempt1.json \
            --out "rows-spike-attempt2.json" \
            --workdir spike-work
      - name: Upload spike rows and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-spike-${{ steps.slug.outputs.slug }}-${{ inputs.attempt }}
          path: |
            rows-spike-attempt*.json
            spike-logs/
          retention-days: 14
