name: ci

# Gates mirror the project's local gates: ruff check, mypy, pytest with 80% coverage floor.
# Third-party actions are pinned to immutable commit SHAs; bump deliberately.
#
# WAL-102 (CI optimization): the suite runs once per PR, split by
# selection. This workflow runs the host selection (-m "not sandbox")
# in three shards (matrix in the host job), each on its own runner;
# the sandbox-tests workflow runs the sandbox selection. The union of
# the selections is the full suite; every job prints the partition
# counts, and each shard's JUnit verify asserts every test it
# collected ran and none skipped. The exact-set proof — every
# collected test named, and selected by exactly one shard — lives
# in the generated test manifest (tests/expected_*_nodeids.txt),
# checked by scripts/check_test_manifest.py in the lint job
# (WAL-109: the hardcoded per-shard counts and embedded file lists
# that used to sit in these matrices were replaced by the manifest;
# a test added without regenerating it fails the lint job with
# the nodeids named). Each host shard
# also writes a JUnit report, and a verify step asserts from it that
# every collected test ran and none skipped (Addendum 55): the host
# selection has no PD_REQUIRE_SANDBOX net, so without this a
# sandbox-gated test whose skipif reason missed the conftest keywords
# would not be marked `sandbox`, would be collected here, and would
# silently skip — running nowhere.
#
# Shards are file groups, balanced on measured per-file durations
# (JUnit, local): the host selection is 508.6s of test time, and the
# shards carry 172.1s / 166.7s / 169.8s (212 / 245 / 148 tests).
# test_orchestrator.py alone is 267.3s of that — too heavy to keep
# whole in one shard — so its tests are split by explicit nodeids
# across all three shards (the nodeids entries in the matrix).
# test_wo81b.py (74.7s, four real-install tests carrying 74.5s of it)
# is split the same way.
# Rebalance the same way when durations move: measure, re-pack,
# update files/nodeids together, and regenerate the test manifest
# (python scripts/check_test_manifest.py --write).
#
# The required `test` check is the aggregate job at the bottom. It
# runs whenever its inputs ran (never a skipped job), succeeds iff
# the changes decision is sound, the lint job succeeded, and every
# host shard succeeded (a matrix job reports success only if all its
# shards did), and it enforces the 80% coverage floor on the shards'
# combined coverage data. The floor is enforced on the host union:
# coverage can only grow when the sandbox job's data is combined in,
# so a host-union pass at 80% guarantees the full union is at 80%.
# A single shard cannot reach a whole-suite floor, so shards record
# coverage with the same --cov flags minus --cov-fail-under and
# upload the data for the aggregate. Lint and typecheck are their
# own job, so a lint failure reports in ~1 minute instead of after
# the long test run. pytest-xdist was removed from the dev
# dependencies in the Addendum 55 round: it was already unused in CI
# (it measured ~neutral on this wait-bound suite, 508s vs 522s
# local), the matrix now provides the parallelism, and serial shards
# keep one coverage data file per shard.
#
# WAL-101 (inert gating): a PR whose changed files are all inert
# (documentation/text only) skips the heavy steps — see the changes
# job. The decision is applied INSIDE each job (its Gate step), never
# by skipping a job itself: `test` is a required branch-protection
# check, and a skipped job would leave the PR's merge state
# ambiguous. An inert PR therefore gets fast, successful runs of
# every job, the `test` aggregate included.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # WAL-101: decide whether the heavy steps need to run. Only
    # pull_request events are ever gated; pushes to main, dispatches,
    # and any doubtful diff (empty included) always run everything.
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.decide.outputs.run_heavy }}
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Decide heavy steps
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "event=$GITHUB_EVENT_NAME: heavy steps always run"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "changed files:"
          echo "$files"
          heavy=true
          if [ -n "$files" ]; then
            heavy=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                # D109 (plan 1.13): only the docs/evaluation files
                # that tests or code actually reference stay
                # NON-INERT — the explicit list below, identical in
                # both gate workflows and guarded by
                # tests/test_check_test_manifest.py against every
                # docs/evaluation reference in tests/, proofdeploy/
                # and scripts/: the run-pair scoring rule cited by
                # proofdeploy/runpair.py, and the registered skill
                # source and its generated author copy
                # (scripts/generate_author_skill.py; the author copy
                # is sha256-checked in tests/test_leakcheck.py).
                # Every other docs/evaluation file is inert, like
                # the rest of docs/.
                docs/evaluation/o21/prompt-v8-header.md|docs/evaluation/o21/skill-v5-author.md|docs/evaluation/scoring-rule-run-pair-2026-10-09.md|docs/evaluation/skill/skill-author.md|docs/evaluation/skill/skill.md) echo "NON-INERT (test input): $f"; heavy=true ;;
                docs/*) echo "inert: $f" ;;
                README.md|CONTRIBUTING.md|SECURITY.md|CHANGELOG.md|CODE_OF_CONDUCT.md) echo "inert: $f" ;;
                LICENSE|LICENSE.*) echo "inert: $f" ;;
                .gitignore|.gitattributes|.editorconfig) echo "inert: $f" ;;
                *) echo "NON-INERT: $f"; heavy=true ;;
              esac
            done <<< "$files"
          else
            echo "empty diff: defaulting to RUN"
          fi
          echo "run_heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "decision: run_heavy=$heavy"

  lint:
    # Fast gate: ruff + mypy, ahead of (and parallel to) the shards,
    # so a lint or type failure reports in ~1 minute.
    needs: changes
    # WAL-101: always() + internal Gate, same fail-closed pattern as
    # the sandbox workflow: a failed changes job fails this job
    # closed instead of skipping it.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate (WAL-101)
        id: gate
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes job did not succeed; failing closed"
            exit 1
          fi
          # Only the two exact decisions may pass this gate; an
          # unset/empty output fails closed instead of skipping green.
          case "${{ needs.changes.outputs.run_heavy }}" in
            true|false) ;;
            *) echo "::error::unexpected run_heavy value '${{ needs.changes.outputs.run_heavy }}'; failing closed"; exit 1 ;;
          esac
          echo "proceed=${{ needs.changes.outputs.run_heavy }}" >> "$GITHUB_OUTPUT"
          echo "run_heavy=${{ needs.changes.outputs.run_heavy }}"
      - name: Inert change — heavy steps skipped (WAL-101)
        if: steps.gate.outputs.proceed == 'false'
        run: echo "Every changed file is inert (documentation/text only); lint and typecheck do not run for this PR."
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.proceed == 'true'
      # actions/setup-python v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
        if: steps.gate.outputs.proceed == 'true'
      - name: lint
        if: steps.gate.outputs.proceed == 'true'
        run: ruff check proofdeploy tests conformance readiness
      - name: typecheck
        if: steps.gate.outputs.proceed == 'true'
        run: mypy proofdeploy conformance readiness
      - name: Test manifest (WAL-109)
        # The exact-set partition proof, fast: the collected
        # suite must equal tests/expected_*_nodeids.txt and
        # every test must be selected by exactly one shard.
        # Adding/removing/renaming a test without regenerating
        # the manifest fails HERE, with the nodeids named — not
        # ten minutes into a shard run. The check collects ONCE
        # (gate-speed item 0; the old 17-collection version of this
        # step took ~11 minutes). WO-CI-SPEED task 2 made the
        # podman capability probe lazy (first use, never at
        # import), so this one collection is now seconds, not the
        # ~2 minutes the import-time probes used to cost.
        if: steps.gate.outputs.proceed == 'true'
        run: python scripts/check_test_manifest.py

  host:
    needs: changes
    # WAL-101: same fail-closed gate pattern as the lint job.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: goldens
            files: "tests/test_executor_addendum20.py tests/test_leakcheck.py tests/test_orchestrator_addendum25.py tests/test_probe.py tests/test_provisioning_sandbox.py tests/test_container_spike.py tests/test_readiness_harness.py tests/test_replay.py tests/test_runner.py tests/test_runpair_addendum21.py tests/test_runpair_addendum24.py tests/test_runpair_addendum25.py tests/test_wo7_pr2.py tests/test_lockfile_drift.py tests/test_golden_fixture_truth.py tests/test_kit_materialize.py tests/test_wo6_regc_add2.py tests/test_wo6_regc_add2_closeout.py tests/test_wo6_bug_select.py tests/test_d213_record_sites.py tests/test_o21_golden_catch.py"
            nodeids: "tests/test_orchestrator.py::test_check_sandbox_runtime_mismatch_fails_closed tests/test_orchestrator.py::test_clean_no_valid_probe_is_false_alarm tests/test_orchestrator.py::test_measure_bug_end_to_end tests/test_orchestrator.py::test_measure_bug_leak_check_fails_closed tests/test_orchestrator.py::test_measure_bug_model_transport_retry_succeeds tests/test_orchestrator.py::test_measure_bug_model_transport_retry_twice tests/test_orchestrator.py::test_measure_bug_refuses_fix_sha_in_snapshot tests/test_orchestrator.py::test_measure_bug_uses_fix_parent_not_b tests/test_orchestrator.py::test_measure_clean_model_transport_retry_succeeds tests/test_orchestrator.py::test_measure_clean_model_transport_retry_twice tests/test_orchestrator.py::test_measure_records_model_finish_reason_and_usage tests/test_orchestrator.py::test_measure_records_model_finish_reason_length tests/test_orchestrator.py::test_measure_records_null_finish_reason_and_usage_when_absent tests/test_orchestrator.py::test_sandboxed_clean_run_records_measured tests/test_orchestrator.py::test_unsandboxed_clean_run_records_not_measured tests/test_orchestrator.py::test_unsandboxed_normal_run_records_not_measured tests/test_wo81b.py::test_host_provisions_committed_lock_ready[poetry]"
          - shard: contracts
            files: "tests/test_change_model.py tests/test_examples.py tests/test_fixture.py tests/test_orchestrator_addendum23.py tests/test_orchestrator_addendum24.py tests/test_provisioning.py tests/test_runpair.py tests/test_runpair_addendum23.py tests/test_sandbox.py tests/test_setup_auth.py tests/test_submodules.py tests/test_toolstate_guard.py tests/test_wo114_contract_store.py tests/test_wo73.py tests/test_wo81.py"
            nodeids: "tests/test_orchestrator.py::test_all_blocks_invalid_records_author_output_invalid tests/test_orchestrator.py::test_check_sandbox_runtime_match tests/test_orchestrator.py::test_check_sandbox_runtime_no_declared_range tests/test_orchestrator.py::test_crash_after_authoring_records_inconclusive tests/test_orchestrator.py::test_declared_registration_provider tests/test_orchestrator.py::test_inconclusive_sandboxed_counts tests/test_orchestrator.py::test_inconclusive_unsandboxed_dev_does_not_count tests/test_orchestrator.py::test_measure_bug_provisioning_failure_is_inconclusive tests/test_orchestrator.py::test_measure_clean_end_to_end tests/test_orchestrator.py::test_measure_config_sandbox_on_by_default tests/test_orchestrator.py::test_measure_needs_revs tests/test_orchestrator.py::test_mixed_valid_invalid_blocks tests/test_orchestrator.py::test_non_json_block_records_author_output_invalid tests/test_orchestrator.py::test_provider_failure_is_inconclusive_auth tests/test_orchestrator.py::test_unsandboxed_run_is_marked_not_measured tests/test_wo81b.py::test_bootstrap_file_pins_exact_version_with_hashes[pdm] tests/test_wo81b.py::test_bootstrap_file_pins_exact_version_with_hashes[poetry] tests/test_wo81b.py::test_bootstrap_file_pins_exact_version_with_hashes[uv] tests/test_wo81b.py::test_committed_lock_plan_shape[pdm] tests/test_wo81b.py::test_committed_lock_plan_shape[poetry] tests/test_wo81b.py::test_committed_lock_plan_shape[uv] tests/test_wo81b.py::test_first_error_line_names_uv_lock_check_error tests/test_wo81b.py::test_host_provisions_committed_lock_ready[pdm] tests/test_wo81b.py::test_manager_versions_pinned_in_code tests/test_wo81b.py::test_sandbox_runs_manager_plan[pdm] tests/test_wo81b.py::test_sandbox_runs_manager_plan[poetry] tests/test_wo81b.py::test_sandbox_runs_manager_plan[uv]"
          - shard: executor
            files: "tests/test_check_test_manifest.py tests/test_cli.py tests/test_executor.py tests/test_generate_author_skill.py tests/test_model_client.py tests/test_regb_template_selection.py tests/test_sandbox_addendum18.py tests/test_verify.py tests/test_wo74.py tests/test_wo81_addendum46.py tests/test_wo81c.py tests/test_wo83.py tests/test_yml.py tests/test_model_workflow_serialization.py tests/test_o21_correction.py tests/test_o21_evidence.py tests/test_o21_prompt_v8.py tests/test_o21_routemap.py tests/test_lean_index.py tests/test_lean_coverage.py tests/test_lean_judge.py tests/test_lean_generate.py tests/test_lean_mutants.py tests/test_lean_clean_units.py"
            nodeids: "tests/test_orchestrator.py::test_evidence_record_carries_provenance tests/test_orchestrator.py::test_inconclusive_unsandboxed_records_not_measured tests/test_orchestrator.py::test_measure_bug_model_overflow_no_retry tests/test_orchestrator.py::test_measure_bug_no_skill_arm_end_to_end tests/test_orchestrator.py::test_measure_bug_refuses_seeded_fix_diff tests/test_orchestrator.py::test_measure_clean_model_overflow_no_retry tests/test_orchestrator.py::test_no_auth_app_clean_run tests/test_orchestrator.py::test_no_auth_app_does_not_crash tests/test_orchestrator.py::test_no_auth_app_model_failure tests/test_orchestrator.py::test_no_blocks_records_author_output_invalid tests/test_orchestrator.py::test_sandboxed_crash_records_measured tests/test_orchestrator.py::test_target_process_group_killed tests/test_orchestrator.py::test_target_process_stopped_after_crash tests/test_orchestrator.py::test_target_process_stopped_after_run tests/test_orchestrator.py::test_unreachable_target_with_invalid_block_scores_inconclusive tests/test_wo81b.py::test_host_mismatch_lock_is_build_failed_with_tool_line tests/test_wo81b.py::test_host_provisions_committed_lock_ready[uv]"

    name: host (${{ matrix.shard }})
    steps:
      - name: Gate (WAL-101)
        id: gate
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes job did not succeed; failing closed"
            exit 1
          fi
          # Only the two exact decisions may pass this gate; an
          # unset/empty output fails closed instead of skipping green.
          case "${{ needs.changes.outputs.run_heavy }}" in
            true|false) ;;
            *) echo "::error::unexpected run_heavy value '${{ needs.changes.outputs.run_heavy }}'; failing closed"; exit 1 ;;
          esac
          echo "proceed=${{ needs.changes.outputs.run_heavy }}" >> "$GITHUB_OUTPUT"
          echo "run_heavy=${{ needs.changes.outputs.run_heavy }}"
      - name: Inert change — heavy steps skipped (WAL-101)
        if: steps.gate.outputs.proceed == 'false'
        run: echo "Every changed file is inert (documentation/text only); the host selection does not run for this PR."
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.proceed == 'true'
      # actions/setup-python v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
        if: steps.gate.outputs.proceed == 'true'
      - name: Install bun (digest-pinned, D150)
        # D150: the goldens shard's truth tests run `bun install`
        # for the node-bun-sqlite golden on the host, and the ubuntu
        # runner ships no bun. Provide it through the repo's OWN
        # digest pin — proofdeploy.provisioning's BUN_RELEASE_SHA256,
        # the pin the sandbox bootstrap verifies (plan 1.2e) — at
        # the version the golden declares (packageManager bun@1.4.3
        # in conformance/golden/node-bun-sqlite). Same release URL,
        # artifact and sha256 verification as _bun_bootstrap_step;
        # no unpinned install, and no other shard needs bun.
        if: steps.gate.outputs.proceed == 'true' && matrix.shard == 'goldens'
        run: |
          set -euo pipefail
          pin="$(python -c 'from proofdeploy.provisioning import BUN_RELEASE_SHA256 as P; a, s = P["1.4.3"]["x86_64"]; print(a, s)')"
          artifact="${pin% *}"
          sha256="${pin##* }"
          dest="$RUNNER_TEMP/pd-bun"
          mkdir -p "$dest/bin"
          curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/$artifact" -o "$dest/bun.zip"
          echo "$sha256  $dest/bun.zip" | sha256sum -c -
          unzip -o -q "$dest/bun.zip" -d "$dest/dist"
          cp "$dest/dist/${artifact%.zip}/bun" "$dest/bin/bun"
          chmod +x "$dest/bin/bun"
          echo "$dest/bin" >> "$GITHUB_PATH"
          "$dest/bin/bun" --version
      - name: tests (this shard)
        if: steps.gate.outputs.proceed == 'true'
        env:
          COVERAGE_FILE: .coverage.host-${{ matrix.shard }}
        run: |
          python -m pytest ${{ matrix.files }} ${{ matrix.nodeids }} -q -W error::ResourceWarning -m "not sandbox" --durations=25 \
            -o addopts="--cov=proofdeploy --cov-report=term-missing" \
            --junitxml=/tmp/host-${{ matrix.shard }}.xml
      - name: Verify shard tests ran (none skipped)
        # Addendum 55: mirror of the sandbox shards' JUnit check. The
        # host selection has no PD_REQUIRE_SANDBOX safety net, and the
        # partition leans on skip-reason wording (tests/conftest.py):
        # a future sandbox-gated test worded without the keywords
        # would not be marked `sandbox`, would be collected by a host
        # shard, and would silently skip — running nowhere. Asserting
        # tests == expected AND skipped == 0 from this shard's own
        # JUnit report closes that permanently.
        # WO-CI-SPEED task 3 (collect once per job): the expected
        # count is derived HERE, in the step that verifies the run —
        # from the generated manifests, via the script's --counts
        # mode — and the ran count comes from THIS run's JUnit
        # report. There is no separate counts step/process anymore.
        # The derivation is exactly as strong as the step it
        # replaces (gate-speed item 0): the lint job proves the
        # manifests equal real collection on this same commit, and
        # --counts asserts the two manifests are disjoint (the
        # partition). WAL-109: no hardcoded per-shard counts or file
        # lists live in this workflow; the exact-set proof is owned
        # by scripts/check_test_manifest.py in the lint job.
        if: ${{ always() && steps.gate.outputs.proceed == 'true' }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          python scripts/check_test_manifest.py --counts "not sandbox" -- ${{ matrix.files }} ${{ matrix.nodeids }} | tee /tmp/counts-${{ matrix.shard }}.txt
          EXPECTED=$(grep '^shard_count=' /tmp/counts-${{ matrix.shard }}.txt | cut -d= -f2)
          echo "expected for this shard (from the manifest): $EXPECTED"
          EXPECTED=$EXPECTED SHARD=$SHARD python3 - <<'EOF'
          import os
          import xml.etree.ElementTree as ET

          path = f"/tmp/host-{os.environ['SHARD']}.xml"
          expected = int(os.environ["EXPECTED"])
          suite = ET.parse(path).getroot()
          if suite.tag != "testsuite":
              suite = suite.find("testsuite")
          tests = int(suite.get("tests"))
          skipped = int(suite.get("skipped"))
          print(f"junit: tests={tests} skipped={skipped} expected={expected}")
          assert skipped == 0, (
              "A55: host tests SKIPPED in a host shard; a skipped host "
              "test runs nowhere"
          )
          assert tests == expected, (
              f"A55: ran {tests} tests but {expected} were collected for this shard"
          )
          print("A55: every collected host test in this shard ran; none skipped")
          EOF
      - name: Upload coverage data (union floor, enforced by the test job)
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.proceed == 'true'
        with:
          name: coverage-host-${{ matrix.shard }}
          path: .coverage.host-${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 7

  test:
    # The required branch-protection check: an aggregate, not a suite
    # run. WAL-101: always() so a failed changes job — or a failed or
    # cancelled shard — reports this check RED promptly instead of
    # leaving it pending; the Gate step below fails closed on
    # anything but a sound decision plus all-success inputs.
    needs: [changes, lint, host]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate and verify inputs (WAL-101/WAL-102)
        id: gate
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes job did not succeed; failing closed so the required check cannot pass untested"
            exit 1
          fi
          # Only the two exact decisions may pass this gate; an
          # unset/empty output fails closed.
          case "${{ needs.changes.outputs.run_heavy }}" in
            true|false) ;;
            *) echo "::error::unexpected run_heavy value '${{ needs.changes.outputs.run_heavy }}'; failing closed"; exit 1 ;;
          esac
          echo "proceed=${{ needs.changes.outputs.run_heavy }}" >> "$GITHUB_OUTPUT"
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::lint job result is '${{ needs.lint.result }}', not success"
            exit 1
          fi
          if [ "${{ needs.host.result }}" != "success" ]; then
            echo "::error::host shards result is '${{ needs.host.result }}', not success (a matrix job reports success only if every shard succeeded)"
            exit 1
          fi
          echo "changes decision sound; lint and all host shards succeeded"
      - name: Inert change — heavy steps skipped (WAL-101)
        if: steps.gate.outputs.proceed == 'false'
        run: echo "Every changed file is inert (documentation/text only); the suite did not run for this PR. This job succeeds so the required 'test' check is satisfied, not wedged."
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.proceed == 'true'
      # actions/setup-python v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
        if: steps.gate.outputs.proceed == 'true'
      - name: Download shard coverage data
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.proceed == 'true'
        with:
          pattern: coverage-host-*
          merge-multiple: true
          path: covdata
      - name: Coverage floor on the combined host union (80%)
        if: steps.gate.outputs.proceed == 'true'
        run: |
          ls -la covdata
          (cd covdata && python -m coverage combine)
          python -m coverage report --data-file=covdata/.coverage --fail-under=80
