name: ci

# Gates mirror the project's local gates: ruff check, mypy, pytest with 80% coverage floor.
# Third-party actions are pinned to immutable commit SHAs; bump deliberately.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: tests
        run: python -m pytest -q
      - name: lint
        run: ruff check proofdeploy tests
      - name: typecheck
        run: mypy proofdeploy
