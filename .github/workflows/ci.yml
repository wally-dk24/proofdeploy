name: ci

# Gates mirror the project's local gates: ruff check, mypy, pytest with 80% coverage floor.
# Third-party actions are pinned to immutable commit SHAs; bump deliberately.
#
# WAL-102 (CI optimization): this job runs only the host selection
# (-m "not sandbox") under pytest-xdist. The sandbox selection runs
# once, in the sandbox-tests workflow. The union of the two selections
# is the full suite; both jobs print the partition counts. The 80%
# coverage floor stays in addopts and is enforced on this selection:
# coverage can only grow when the sandbox job's data is combined in,
# so a host-selection pass at 80% guarantees the union is at 80%.
# Lint and typecheck run BEFORE the suite, so a lint failure reports
# in ~1 minute instead of after the long test run.
#
# WAL-101 (inert gating): a PR whose changed files are all inert
# (documentation/text only) skips the heavy steps — see the changes
# job. The decision is applied INSIDE the test job, never by skipping
# the job itself: `test` is a required branch-protection check, and a
# skipped job would leave the PR's merge state ambiguous. An inert PR
# therefore gets a fast, successful `test` run.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # WAL-101: decide whether the heavy steps need to run. Only
    # pull_request events are ever gated; pushes to main, dispatches,
    # and any doubtful diff (empty included) always run everything.
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.decide.outputs.run_heavy }}
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Decide heavy steps
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "event=$GITHUB_EVENT_NAME: heavy steps always run"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "changed files:"
          echo "$files"
          heavy=true
          if [ -n "$files" ]; then
            heavy=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                # Load-bearing despite living under docs/: tests read
                # the registered skill file and check its sha256
                # (tests/test_leakcheck.py). Never inert.
                docs/evaluation/*) echo "NON-INERT (test input): $f"; heavy=true ;;
                docs/*) echo "inert: $f" ;;
                README.md|CONTRIBUTING.md|SECURITY.md|CHANGELOG.md|CODE_OF_CONDUCT.md) echo "inert: $f" ;;
                LICENSE|LICENSE.*) echo "inert: $f" ;;
                .gitignore|.gitattributes|.editorconfig) echo "inert: $f" ;;
                *) echo "NON-INERT: $f"; heavy=true ;;
              esac
            done <<< "$files"
          else
            echo "empty diff: defaulting to RUN"
          fi
          echo "run_heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "decision: run_heavy=$heavy"

  test:
    needs: changes
    # WAL-101: always() so a FAILED changes job reaches the Gate step
    # and fails this job closed, instead of the required check being
    # skipped (which branch protection would read as satisfied).
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate (WAL-101)
        id: gate
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes job did not succeed; failing closed so the required check cannot pass untested"
            exit 1
          fi
          # Only the two exact decisions may pass this gate. Anything
          # else (an unset/empty output included) fails closed rather
          # than letting every heavy step skip and the job go green.
          case "${{ needs.changes.outputs.run_heavy }}" in
            true|false) ;;
            *) echo "::error::unexpected run_heavy value '${{ needs.changes.outputs.run_heavy }}'; failing closed"; exit 1 ;;
          esac
          echo "proceed=${{ needs.changes.outputs.run_heavy }}" >> "$GITHUB_OUTPUT"
          echo "run_heavy=${{ needs.changes.outputs.run_heavy }}"
      - name: Inert change — heavy steps skipped (WAL-101)
        if: steps.gate.outputs.proceed == 'false'
        run: echo "Every changed file is inert (documentation/text only); the suite does not run for this PR. This job succeeds so the required 'test' check is satisfied, not wedged."
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.gate.outputs.proceed == 'true'
      # actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
        if: steps.gate.outputs.proceed == 'true'
      - name: lint
        if: steps.gate.outputs.proceed == 'true'
        run: ruff check proofdeploy tests conformance
      - name: typecheck
        if: steps.gate.outputs.proceed == 'true'
        run: mypy proofdeploy conformance
      - name: Selection counts (WAL-102 partition proof)
        if: steps.gate.outputs.proceed == 'true'
        run: |
          count() { python -m pytest --collect-only -q -o addopts="" -p no:cacheprovider "$@" 2>/dev/null | grep -c "::" || true; }
          full=$(count)
          host=$(count -m "not sandbox")
          sand=$(count -m "sandbox")
          echo "collection: full=$full host=$host sandbox=$sand"
          if [ "$((host + sand))" -ne "$full" ]; then
            echo "::error::partition broken: host($host) + sandbox($sand) != full($full)"
            exit 1
          fi
      - name: tests
        if: steps.gate.outputs.proceed == 'true'
        env:
          COVERAGE_FILE: .coverage.ci
        run: python -m pytest -q -W error::ResourceWarning -m "not sandbox" -n auto --durations=25
      - name: Upload coverage data (union audit)
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.gate.outputs.proceed == 'true'
        with:
          name: coverage-ci
          path: .coverage.ci
          include-hidden-files: true
          retention-days: 7
