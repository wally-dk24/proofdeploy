name: pr-agent

# OSS agent reviewer on every PR (ADR 0003). Advisory, non-blocking.
# Requires the GROQ_API_KEY repository secret (Settings -> Secrets -> Actions).
# Third-party actions are pinned to immutable commit SHAs; bump deliberately.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:

permissions:
  pull-requests: write
  issues: write

jobs:
  review:
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name != 'issue_comment' ||
       contains(github.event.comment.body, '/review') ||
       contains(github.event.comment.body, '/describe') ||
       contains(github.event.comment.body, '/improve') ||
       contains(github.event.comment.body, '/ask'))
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent review
        # qodo-ai/pr-agent v0.47.0
        uses: qodo-ai/pr-agent@8e5a9295973b24af4b70cafd0b660a230811ef9e
        env:
          # Both documented key forms; identical values, no conflict.
          OPENAI_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI__KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI__API_BASE: "https://api.groq.com/openai/v1"
          # Must be a model on the account; verified 2026-10-08 via /openai/v1/models.
          CONFIG__MODEL: "groq/openai/gpt-oss-120b"
          # Effective cap is Groq's free-tier TPM budget (8000/min), not the
          # model's 128k context. Keeps review prompts under the per-minute
          # ceiling; pr-agent clips large diffs to fit. Raise if the Groq tier
          # is ever upgraded.
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "6000"
          # Nested settings use dotted keys in this action (per pr-agent docs);
          # the CONFIG__ form only reaches top-level settings. One LLM call
          # per trigger fits the free-tier TPM budget; /describe and /improve
          # stay available as manual issue-comment commands.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}




