# Sandbox container tests (WO-5).
#
# Do NOT claim CI works until a real run log exists; see
# docs/sandbox-ci.md "What the first CI run must show".
#
# WAL-102 (CI optimization): this workflow now runs ONLY the sandbox
# selection (-m sandbox, auto-marked by tests/conftest.py) instead of
# the full suite. The full suite still runs on every PR — as the union
# of the ci workflow's host selection and this selection; both jobs
# print the partition counts. The selection is sharded (matrix below)
# so the wall time is the slowest shard, not the sum. WAL-109 (split):
# the old apps/core/provisions grouping is rebalanced by measured
# duration toward ~10 minutes per shard — conformance runs one shard
# per golden variant (nodeids), provisions splits into the manager
# variants and the standalone app provisions, core splits by file.
# Which shard selects which test is proven by
# scripts/check_test_manifest.py against
# tests/expected_sandbox_nodeids.txt (the same 48 nodeids as before;
# only the assignment moved).
# WAL-110 (split, structure only): provisions-apps (28m27s job on the
# last full green run) splits by family into provisions-real-apps
# (the WO-8.3 Directus/Ghost real-app proofs),
# provisions-wo83-goldens (the five WO-8.3 golden tests) and
# provisions-original (the pre-WO-8.3 provisions files: uptime-kuma,
# forced-compile, node26-corepack, node-headers). The pnpm and flask
# conformance shards each split 5/5 by case; both halves re-run the
# module-scoped golden fixture, so each half carries the fixture's
# measured-run cost plus its own cases' in-call costs (case2/5/6 do
# their own provisions; the other cases assert on the fixture's
# records). Same 55 sandbox nodeids, each selected by exactly one
# shard — proven by scripts/check_test_manifest.py; no test, product
# code, or per-shard step changed.
# WO-CI-SPEED task 5 (D53) — shard re-pack to the job budget. PR
# #112's measurement: a push fanned out to 23 jobs (ci 6 +
# sandbox-tests 17) against the GitHub Free plan's 20-concurrent-job
# cap, so ~3 jobs always queued behind finished ones and queue time
# (medians 599–1047.5s on the late jobs) dominated wall clock. The
# binding constraint is the job COUNT, not any shard's duration, so
# the four 5/5 conformance splits above (pnpm, pnpm-monorepo, bun,
# flask) are merged back into one shard per app: each merged shard
# is the sum of its halves minus one duplicated module fixture and
# one job's setup overhead (~950–1100s estimated from the halves'
# 546–608s medians), still less than the queue delay its second job
# used to wait out. Same sandbox nodeids, each selected by exactly
# one shard — proven by scripts/check_test_manifest.py, as before;
# no test, product code, or per-shard step changed. New totals:
# sandbox-tests 13 jobs (changes + 12 shards), ci 6 — 19 per push,
# one under the cap. The cap is enforced mechanically:
# scripts/check_test_manifest.py fails the ci lint job when the
# expanded per-push job count of the two gate workflows exceeds 20.
# Lint/typecheck are NOT repeated here: the ci workflow's identical
# commands are the gate.

name: sandbox-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # WAL-101: same inert-change decision as the ci workflow. Only
    # pull_request events are ever gated; pushes to main, dispatches,
    # and any doubtful diff (empty included) always run everything.
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.decide.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Decide heavy steps
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "event=$GITHUB_EVENT_NAME: heavy steps always run"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "changed files:"
          echo "$files"
          heavy=true
          if [ -n "$files" ]; then
            heavy=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                # D109 (plan 1.13): only the docs/evaluation files
                # that tests or code actually reference stay
                # NON-INERT — the explicit list below, identical in
                # both gate workflows and guarded by
                # tests/test_check_test_manifest.py against every
                # docs/evaluation reference in tests/, proofdeploy/
                # and scripts/: the run-pair scoring rule cited by
                # proofdeploy/runpair.py, and the registered skill
                # source and its generated author copy
                # (scripts/generate_author_skill.py; the author copy
                # is sha256-checked in tests/test_leakcheck.py).
                # Every other docs/evaluation file is inert, like
                # the rest of docs/.
                docs/evaluation/o21/prompt-v8-header.md|docs/evaluation/o21/skill-v5-author.md|docs/evaluation/scoring-rule-run-pair-2026-10-09.md|docs/evaluation/skill/skill-author.md|docs/evaluation/skill/skill.md) echo "NON-INERT (test input): $f"; heavy=true ;;
                docs/*) echo "inert: $f" ;;
                README.md|CONTRIBUTING.md|SECURITY.md|CHANGELOG.md|CODE_OF_CONDUCT.md) echo "inert: $f" ;;
                LICENSE|LICENSE.*) echo "inert: $f" ;;
                .gitignore|.gitattributes|.editorconfig) echo "inert: $f" ;;
                *) echo "NON-INERT: $f"; heavy=true ;;
              esac
            done <<< "$files"
          else
            echo "empty diff: defaulting to RUN"
          fi
          echo "run_heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "decision: run_heavy=$heavy"

  sandbox:
    needs: changes
    # WAL-101: same fail-closed gate pattern as the ci workflow.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core-sandbox
            files: "tests/test_sandbox.py"
          - shard: core-orchestrator
            files: "tests/test_orchestrator.py"
          - shard: apps-node-express
            nodeids: "tests/test_conformance.py::test_case10_record_replays_to_same_verdict[node-express-sqlite] tests/test_conformance.py::test_case1_frozen_lockfile_honored[node-express-sqlite] tests/test_conformance.py::test_case2_lockfile_mismatch_commit_refused[node-express-sqlite] tests/test_conformance.py::test_case3_declared_runtime_selected_and_reported[node-express-sqlite] tests/test_conformance.py::test_case4_build_migrate_seed_run[node-express-sqlite] tests/test_conformance.py::test_case5_forced_start_failure_typed_with_error[node-express-sqlite] tests/test_conformance.py::test_case6_network_cut_and_no_secret_in_container[node-express-sqlite] tests/test_conformance.py::test_case7_bug_pair_fails_at_parent_passes_at_fix[node-express-sqlite] tests/test_conformance.py::test_case8_clean_commit_no_fail[node-express-sqlite] tests/test_conformance.py::test_case9_no_canary_in_records[node-express-sqlite]"
          - shard: apps-node-pnpm
            nodeids: "tests/test_conformance.py::test_case1_frozen_lockfile_honored[node-pnpm-sqlite] tests/test_conformance.py::test_case2_lockfile_mismatch_commit_refused[node-pnpm-sqlite] tests/test_conformance.py::test_case3_declared_runtime_selected_and_reported[node-pnpm-sqlite] tests/test_conformance.py::test_case4_build_migrate_seed_run[node-pnpm-sqlite] tests/test_conformance.py::test_case5_forced_start_failure_typed_with_error[node-pnpm-sqlite] tests/test_conformance.py::test_case6_network_cut_and_no_secret_in_container[node-pnpm-sqlite] tests/test_conformance.py::test_case7_bug_pair_fails_at_parent_passes_at_fix[node-pnpm-sqlite] tests/test_conformance.py::test_case8_clean_commit_no_fail[node-pnpm-sqlite] tests/test_conformance.py::test_case9_no_canary_in_records[node-pnpm-sqlite] tests/test_conformance.py::test_case10_record_replays_to_same_verdict[node-pnpm-sqlite]"
          # Plan 1.2b: the pnpm workspace (monorepo) golden.
          # WO-CI-SPEED task 5 merged its 5/5 split (see header).
          - shard: apps-node-monorepo
            nodeids: "tests/test_conformance.py::test_case1_frozen_lockfile_honored[node-pnpm-monorepo] tests/test_conformance.py::test_case2_lockfile_mismatch_commit_refused[node-pnpm-monorepo] tests/test_conformance.py::test_case3_declared_runtime_selected_and_reported[node-pnpm-monorepo] tests/test_conformance.py::test_case4_build_migrate_seed_run[node-pnpm-monorepo] tests/test_conformance.py::test_case5_forced_start_failure_typed_with_error[node-pnpm-monorepo] tests/test_conformance.py::test_case6_network_cut_and_no_secret_in_container[node-pnpm-monorepo] tests/test_conformance.py::test_case7_bug_pair_fails_at_parent_passes_at_fix[node-pnpm-monorepo] tests/test_conformance.py::test_case8_clean_commit_no_fail[node-pnpm-monorepo] tests/test_conformance.py::test_case9_no_canary_in_records[node-pnpm-monorepo] tests/test_conformance.py::test_case10_record_replays_to_same_verdict[node-pnpm-monorepo]"
          # Plan 1.2e: the bun golden. WO-CI-SPEED task 5 merged
          # its 5/5 split (see header).
          - shard: apps-node-bun
            nodeids: "tests/test_conformance.py::test_case1_frozen_lockfile_honored[node-bun-sqlite] tests/test_conformance.py::test_case2_lockfile_mismatch_commit_refused[node-bun-sqlite] tests/test_conformance.py::test_case3_declared_runtime_selected_and_reported[node-bun-sqlite] tests/test_conformance.py::test_case4_build_migrate_seed_run[node-bun-sqlite] tests/test_conformance.py::test_case5_forced_start_failure_typed_with_error[node-bun-sqlite] tests/test_conformance.py::test_case6_network_cut_and_no_secret_in_container[node-bun-sqlite] tests/test_conformance.py::test_case7_bug_pair_fails_at_parent_passes_at_fix[node-bun-sqlite] tests/test_conformance.py::test_case8_clean_commit_no_fail[node-bun-sqlite] tests/test_conformance.py::test_case9_no_canary_in_records[node-bun-sqlite] tests/test_conformance.py::test_case10_record_replays_to_same_verdict[node-bun-sqlite]"
          - shard: apps-python-flask
            nodeids: "tests/test_conformance.py::test_case1_frozen_lockfile_honored[python-flask-sqlite] tests/test_conformance.py::test_case2_lockfile_mismatch_commit_refused[python-flask-sqlite] tests/test_conformance.py::test_case3_declared_runtime_selected_and_reported[python-flask-sqlite] tests/test_conformance.py::test_case4_build_migrate_seed_run[python-flask-sqlite] tests/test_conformance.py::test_case5_forced_start_failure_typed_with_error[python-flask-sqlite] tests/test_conformance.py::test_case6_network_cut_and_no_secret_in_container[python-flask-sqlite] tests/test_conformance.py::test_case7_bug_pair_fails_at_parent_passes_at_fix[python-flask-sqlite] tests/test_conformance.py::test_case8_clean_commit_no_fail[python-flask-sqlite] tests/test_conformance.py::test_case9_no_canary_in_records[python-flask-sqlite] tests/test_conformance.py::test_case10_record_replays_to_same_verdict[python-flask-sqlite]"
          - shard: provisions-managers
            files: "tests/test_verify_sandbox.py tests/test_wo81b_sandbox.py tests/test_wo81_generated_variant.py tests/test_lean_sandbox.py"
          - shard: provisions-real-apps
            nodeids: "tests/test_wo83_sandbox.py::test_directus_login_refresh_proof_in_sandbox tests/test_wo83_sandbox.py::test_ghost_ghost_jwt_proof_in_sandbox"
          - shard: provisions-wo83-goldens
            nodeids: "tests/test_wo83_sandbox.py::test_golden_bootstrap_values_differ_per_side_in_sandbox tests/test_wo83_sandbox.py::test_golden_ghost_jwt_from_seed_key_file_in_sandbox tests/test_wo83_sandbox.py::test_golden_ghost_missing_key_file_inconclusive_in_sandbox tests/test_wo83_sandbox.py::test_golden_login_mode_in_sandbox tests/test_wo83_sandbox.py::test_golden_refresh_mode_in_sandbox"
          - shard: provisions-original
            files: "tests/test_uptime_kuma.py tests/test_node26_corepack.py tests/test_forced_compile.py tests/test_node_headers.py"
          # WAL-118: the container spike's build-network property
          # test — a real rootless build proving a RUN step cannot
          # reach a service on the host's loopback. WAL-120 adds
          # the build-caps property test (a RUN chown builds under
          # BUILD_CAPS; a step needing NET_ADMIN still fails).
          # Every other container-spike test is host-side (ci
          # workflow).
          - shard: spike-build-network
            nodeids: "tests/test_container_spike.py::test_build_caps_allow_chown_but_not_net_admin tests/test_container_spike.py::test_build_network_blocks_host_loopback"
    name: sandbox (${{ matrix.shard }})
    steps:
      - name: Gate (WAL-101)
        id: gate
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes job did not succeed; failing closed"
            exit 1
          fi
          # Only the two exact decisions may pass this gate; an
          # unset/empty output fails closed instead of skipping green.
          case "${{ needs.changes.outputs.run_heavy }}" in
            true|false) ;;
            *) echo "::error::unexpected run_heavy value '${{ needs.changes.outputs.run_heavy }}'; failing closed"; exit 1 ;;
          esac
          echo "proceed=${{ needs.changes.outputs.run_heavy }}" >> "$GITHUB_OUTPUT"
          echo "run_heavy=${{ needs.changes.outputs.run_heavy }}"
      - name: Inert change — heavy steps skipped (WAL-101)
        if: steps.gate.outputs.proceed == 'false'
        run: echo "Every changed file is inert (documentation/text only); the sandbox selection does not run for this PR."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.proceed == 'true'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install podman
        if: steps.gate.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install package and dev dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run sandbox selection (this shard)
        # B3 (Addendum 16): PD_REQUIRE_SANDBOX=1 turns any sandbox
        # test skip into a failure; the Verify step below additionally
        # asserts from the JUnit report that every collected test ran
        # and none skipped.
        #
        # The 80% coverage floor (pyproject addopts) is NOT applied to
        # this subset — a subset cannot reach a whole-suite floor. It
        # is enforced in the ci workflow on the host selection, which
        # bounds the union from below (coverage combine only adds
        # covered lines). This job still records coverage data and
        # uploads it for the union audit.
        if: steps.gate.outputs.proceed == 'true'
        env:
          PD_REQUIRE_SANDBOX: "1"
          COVERAGE_FILE: .coverage.sandbox-${{ matrix.shard }}
        run: |
          python -m pytest ${{ matrix.files }} ${{ matrix.nodeids }} -m sandbox -q --durations=25 \
            -o addopts="--cov=proofdeploy --cov-report=term-missing" \
            --junitxml=/tmp/sandbox-${{ matrix.shard }}.xml

      - name: Upload provision logs
        # Addendum 35: the full provision logs of the conformance /
        # node26 / uptime-kuma provisions (pd-logs/, written by the
        # tests) — a failing install's real error line must survive
        # even where an assertion message would trim it.
        if: ${{ always() && steps.gate.outputs.proceed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pd-logs-${{ matrix.shard }}
          path: pd-logs/
          retention-days: 7

      - name: Verify sandbox tests ran (not skipped)
        # B3 successor: reads THIS run's JUnit report (the old step
        # re-ran three already-run tests for 393s). Proves the shard's
        # collected sandbox tests all ran and none skipped.
        # WO-CI-SPEED task 3 (collect once per job): the expected
        # count is derived HERE, in the step that verifies the run —
        # from the generated manifests, via the script's --counts
        # mode — and the ran count comes from THIS run's JUnit
        # report. There is no separate counts step/process anymore.
        # WAL-109: the partition proof is owned by
        # scripts/check_test_manifest.py in the ci workflow's lint
        # job: the collected sandbox selection must equal
        # tests/expected_sandbox_nodeids.txt and every test must be
        # selected by exactly one shard of this matrix. The ci lint
        # job proves the manifests equal real collection on the same
        # commit.
        if: ${{ always() && steps.gate.outputs.proceed == 'true' }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          python scripts/check_test_manifest.py --counts "sandbox" -- ${{ matrix.files }} ${{ matrix.nodeids }} | tee /tmp/counts-${{ matrix.shard }}.txt
          EXPECTED=$(grep '^shard_count=' /tmp/counts-${{ matrix.shard }}.txt | cut -d= -f2)
          echo "expected for this shard (from the manifest): $EXPECTED"
          EXPECTED=$EXPECTED SHARD=$SHARD python3 - <<'EOF'
          import os
          import xml.etree.ElementTree as ET

          path = f"/tmp/sandbox-{os.environ['SHARD']}.xml"
          expected = int(os.environ["EXPECTED"])
          suite = ET.parse(path).getroot()
          if suite.tag != "testsuite":
              suite = suite.find("testsuite")
          tests = int(suite.get("tests"))
          skipped = int(suite.get("skipped"))
          print(f"junit: tests={tests} skipped={skipped} expected={expected}")
          assert skipped == 0, "B3: sandbox tests SKIPPED in the sandbox job"
          assert tests == expected, (
              f"B3: ran {tests} tests but {expected} were collected for this shard"
          )
          print("B3: every collected sandbox test in this shard ran; none skipped")
          EOF

      - name: Upload coverage data (union audit)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.proceed == 'true'
        with:
          name: coverage-sandbox-${{ matrix.shard }}
          path: .coverage.sandbox-${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 7

      - name: Show sandbox capability probe
        # The probe output says which isolation modes this runner
        # actually supports (userns remapping, bridge network for the
        # install phase, isolated app network). A reviewer needs these
        # before trusting measured runs here: recent Ubuntu runners may
        # restrict user namespaces, in which case the measurement gate
        # refuses and a different runner/VM is needed.
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python -c "
          from proofdeploy.sandbox import check_sandbox_capabilities
          caps = check_sandbox_capabilities()
          print('podman:', caps.podman, caps.podman_version)
          print('isolated_network:', caps.isolated_network)
          print('build_network:', caps.build_network)
          print('userns_remap:', caps.userns_remap)
          print('reason:', caps.reason)
          "
