# Sandbox container tests (WO-5).
#
# Do NOT claim CI works until a real run log exists; see
# docs/sandbox-ci.md "What the first CI run must show".

name: sandbox-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and typecheck
        run: |
          python -m ruff check proofdeploy tests conformance
          python -m mypy proofdeploy conformance

      - name: Run full test suite
        # The full suite (not just the sandbox tests): the sandbox
        # tests must actually RUN here rather than skip, proving the
        # runner can do real container isolation.
        #
        # B3 (Addendum 16): PD_REQUIRE_SANDBOX=1 turns any sandbox
        # test skip into a failure. A silently-skipping sandbox test
        # hides real bugs (the T1 miss); this job must prove the
        # tests ran.
        env:
          PD_REQUIRE_SANDBOX: "1"
        run: |
          python -m pytest tests/ -v

      - name: Upload provision logs
        # Addendum 35: the full provision logs of the conformance /
        # node26 / uptime-kuma provisions (pd-logs/, written by the
        # tests) — a failing install's real error line must survive
        # even where an assertion message would trim it.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pd-logs
          path: pd-logs/
          retention-days: 7

      - name: Verify sandbox tests ran (not skipped)
        # B3: belt-and-braces check that the key sandbox tests were
        # collected and ran. Fails the job if they skipped.
        run: |
          python -m pytest tests/test_sandbox.py::test_sandbox_install_and_run tests/test_orchestrator.py::test_sandboxed_provision_keeps_installed_dependencies tests/test_orchestrator.py::test_sandboxed_failed_start_captures_app_log -v --no-header -q 2>&1 | tee /tmp/sandbox-verify.log
          if grep -q "SKIPPED" /tmp/sandbox-verify.log; then
            echo "B3: expected sandbox tests SKIPPED — failing the job"
            exit 1
          fi
          if ! grep -q "3 passed" /tmp/sandbox-verify.log; then
            echo "B3: expected 3 sandbox tests to pass"
            exit 1
          fi

      - name: Show sandbox capability probe
        # The probe output says which isolation modes this runner
        # actually supports (userns remapping, bridge network for the
        # install phase, isolated app network). A reviewer needs these
        # before trusting measured runs here: recent Ubuntu runners may
        # restrict user namespaces, in which case the measurement gate
        # refuses and a different runner/VM is needed.
        run: |
          python -c "
          from proofdeploy.sandbox import check_sandbox_capabilities
          caps = check_sandbox_capabilities()
          print('podman:', caps.podman, caps.podman_version)
          print('isolated_network:', caps.isolated_network)
          print('build_network:', caps.build_network)
          print('userns_remap:', caps.userns_remap)
          print('reason:', caps.reason)
          "
