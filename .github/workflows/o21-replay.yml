# O21 replay experiment (D236). Not a measured result. Triggered only by a
# push to experiment/o21-replay (the build branch is experiment/o21-replay-build
# and does not trigger it). Model key: the `measurement` environment, as in measure.yml.
name: o21-replay

on:
  push:
    branches: [experiment/o21-replay]

permissions:
  contents: read

concurrency:
  group: proofdeploy-model-calls
  cancel-in-progress: false
  queue: max

jobs:
  replay:
    runs-on: ubuntu-latest
    environment: measurement
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run O21 replay
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python experiments/o21-replay/run_replay.py

      - name: Upload results
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: o21-replay-results
          path: experiments/o21-replay/out/
