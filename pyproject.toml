[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofdeploy"
version = "0.1.0"
description = "Diff in, verified out: probe what changed, render verdicts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0", "coverage==7.16.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.10", "types-PyYAML>=6.0"]

[tool.setuptools.packages.find]
# Explicit: the repo also hosts the Claude Code plugin marketplace under
# plugins/, which must never be mistaken for a Python package.
include = ["proofdeploy*"]

[project.scripts]
proofdeploy = "proofdeploy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=proofdeploy --cov-report=term-missing --cov-fail-under=80"
markers = [
    "sandbox: tests that need the container sandbox (podman); auto-applied by tests/conftest.py to tests carrying a sandbox-capability skipif; selected with -m sandbox in the sandbox-tests CI job, deselected with -m 'not sandbox' in the ci job",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF100"]

[tool.mypy]
python_version = "3.10"
# The golden fixture trees repeat the same module names across
# revisions (app.py in base/bug/fix/...): they are fixture DATA the
# kit materializes, not a package — mypy cannot check duplicate
# module names in one run. conformance/kit.py itself is checked.
exclude = "conformance/golden/"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
