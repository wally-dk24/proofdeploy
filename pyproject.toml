[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofdeploy"
version = "0.1.0"
description = "Diff in, verified out: probe what changed, render verdicts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.10", "types-PyYAML>=6.0"]

[tool.setuptools.packages.find]
# Explicit: the repo also hosts the Claude Code plugin marketplace under
# plugins/, which must never be mistaken for a Python package.
include = ["proofdeploy*"]

[project.scripts]
proofdeploy = "proofdeploy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=proofdeploy --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF100"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
