# Generic fixture for saleor/saleor
# Written before WO-6 selection runs. Describes how to build, start, and
# seed the app. Not tied to any specific bug.

build: "pip install -r requirements.txt && python manage.py migrate"
start: "python manage.py runserver 0.0.0.0:8000"
seed: "python manage.py populatedb"

fixture:
  description: |
    Repository: saleor/saleor
    Target: http://localhost:8000
    This is a Python/Django e-commerce platform (GraphQL API). The app
    serves HTTP on port 8000. Authentication is via JWT (or session for
    dashboard at /dashboard/). The database is PostgreSQL.
  auth:
    type: jwt
    login_path: /graphql/
