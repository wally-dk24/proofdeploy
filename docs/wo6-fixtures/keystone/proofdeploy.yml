# Generic fixture for keystonejs/keystone
# Written before WO-6 selection runs. Describes how to build, start, and
# seed the app. Not tied to any specific bug.

build: "npm install"
start: "npm run dev -- --port 8000"
seed: "npm run seed"

fixture:
  description: |
    Repository: keystonejs/keystone
    Target: http://localhost:8000
    This is a Node.js headless CMS. The app serves HTTP on port 8000.
    Authentication is via session (Admin UI at /admin). The database is
    configurable (SQLite/PostgreSQL).
  auth:
    type: session
    login_path: /admin
