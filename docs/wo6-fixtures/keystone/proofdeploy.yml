# Generic fixture for keystonejs/keystone
# Written before WO-6 selection runs. Describes how to build, start, and
# seed the app. Not tied to any specific bug.
# Validated with the real loader.
# Note: Keystone is a monorepo; the runnable app location must be verified
# during provisioning proof. If no app is provisionable at the root,
# this candidate is dropped per the rule.

repo_name: keystonejs/keystone
build: "npm run build"
start: "npm run start -- --port $PORT"
readiness: /
seed_note: "No seed step; admin user created on first run."
auth_mechanism: "session"
auth_scope: "Session; Admin UI at /admin"
flags_note: "SQLite supported."
