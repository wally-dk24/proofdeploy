# Generic fixture for django-oscar/django-oscar
# Written before WO-6 selection runs. Describes how to build, start, and
# seed the app. Not tied to any specific bug.

build: "pip install -r requirements.txt && python manage.py migrate"
start: "python manage.py runserver 0.0.0.0:8000"
seed: "python manage.py oscar_populate_countries"

fixture:
  description: |
    Repository: django-oscar/django-oscar
    Target: http://localhost:8000
    This is a Django-based e-commerce framework. The app serves HTTP on
    port 8000. Authentication is via Django session (login at /accounts/login/).
    The database is SQLite by default (or PostgreSQL if configured).
  auth:
    type: session
    login_path: /accounts/login/
