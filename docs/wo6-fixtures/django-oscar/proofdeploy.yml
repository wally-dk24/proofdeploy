# Generic fixture for django-oscar/django-oscar
# Written before WO-6 selection runs. Describes how to build, start, and
# seed the app. Not tied to any specific bug.
# Validated with the real loader.

repo_name: django-oscar/django-oscar
# The runnable app is in sandbox/ (the repo root is the framework).
app_dir: sandbox
build: "python manage.py migrate"
migrate: "python manage.py migrate"
seed: "python manage.py oscar_populate_countries"
start: "python manage.py runserver 0.0.0.0:$PORT"
readiness: /
seed_note: "Populates countries via oscar_populate_countries."
auth_mechanism: "session"
auth_scope: "Django session; login at /accounts/login/"
flags_note: "SQLite by default."
