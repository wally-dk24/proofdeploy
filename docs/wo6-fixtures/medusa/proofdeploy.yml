# Generic fixture for medusajs/medusa
# Written before WO-6 selection runs. Describes how to build, start, and
# seed the app. Not tied to any specific bug.

build: "npm install"
start: "npm run start -- --port 8000"
seed: "npm run seed"

fixture:
  description: |
    Repository: medusajs/medusa
    Target: http://localhost:8000
    This is a Node.js e-commerce platform. The app serves HTTP on port 8000.
    Authentication is via JWT (admin API at /admin). The database is
    PostgreSQL (or SQLite for dev).
  auth:
    type: jwt
    login_path: /admin/auth/login
